<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>機体エディタ</title>
<style>
  :root { --bg: #14161a; --panel: #1d2026; --line: #2c3038; --text: #e2e5ec; --dim: #9aa0aa; --acc: #6fb3ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.8 system-ui, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  .lead { color: var(--dim); margin: 0 0 36px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; margin-bottom: 18px; }
  .card h2 { font-size: 22px; margin: 0 0 4px; }
  .card .what { font-size: 18px; margin: 0 0 18px; }
  .go { display: inline-block; padding: 10px 20px; border-radius: 8px; background: #2b4a6f; border: 1px solid #3d6a9c; color: #fff; text-decoration: none; font-weight: 600; }
  .v3 .go { background: #5a4126; border-color: #8a6233; }
  .go:hover { filter: brightness(1.15); }
  .flow { margin: 40px 0; padding: 20px 24px; border: 1px dashed var(--line); border-radius: 12px; color: var(--dim); }
  .flow b { color: var(--text); }
  .guide { display: block; text-align: center; padding: 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--acc); font-size: 18px; font-weight: 600; text-decoration: none; }
  .guide:hover { border-color: #3d6a9c; }
</style>
<!-- links made before this page (a login's return, ?save=, ?central=) still open the editor -->
<script>if (location.search || location.hash) location.replace('./v2.html' + location.search + location.hash);</script>
</head>
<body>
<main>
  <h1>機体エディタ</h1>
  <p class="lead">XS の形をブラウザで作る道具です。</p>

  <div class="card">
    <h2>機体エディタ Ver2</h2>
    <p class="what">機体をまるごと作る</p>
    <a class="go" href="./v2.html">開く</a>
  </div>

  <div class="card v3">
    <h2>リアルパーツエディタ</h2>
    <p class="what">頭をくわしく作り込む</p>
    <a class="go" href="./v3.html">開く</a>
  </div>

  <div class="flow">
    <b>ふつうは Ver2 だけで作れます。</b><br>
    頭をもっと作り込みたい時だけ、リアルパーツエディタで頭を作って Ver2 に入れます。
  </div>

  <a class="guide" href="./guide.html">はじめての方へ：機体の作り方 →</a>
</main>
</body>
</html>
